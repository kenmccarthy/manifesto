<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Manifesto Interactive Course</title>
<link rel="icon" type="image/x-icon" href="../favicon.ico" />
<link rel="stylesheet" href="../shared/base.css">
<link rel="stylesheet" href="css/course.css">
</head>

<body>
  <a class="skip" href="#view">Skip to content</a>

  <header class="course-header">
    <button id="navToggle" class="nav-toggle" aria-expanded="false" aria-controls="courseNav">Menu</button>
    <a class="course-brand" href="index.html">Manifesto · Course</a>
    <div class="header-actions">
      <button id="resumeBtn" class="c-btn ghost small" type="button">Resume</button>
    </div>
  </header>

  <div class="progress-rail" role="progressbar" aria-label="Course progress" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
    <div id="progressBar" class="progress-bar"></div>
  </div>

  <div class="course-app">
    <nav id="courseNav" class="course-nav" aria-label="Course sections"></nav>
    <div id="navOverlay" class="nav-overlay" hidden></div>
    <main id="view" class="course-view" tabindex="-1"></main>
  </div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
